{% load static %}

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FitTrack Pro{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/index.css' %}" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar d-flex flex-column">
        <div class="text-center mb-4 mt-3">
          <h4 class="fw-bold text-white">FitTrack Pro</h4>
        </div>

        <!-- Profile Box -->
        <div class="profile-box d-flex align-items-center mb-4 px-3">
          <div class="profile-avatar me-2">{{ user.first_name|first|upper }}</div>
          <div>
            <p class="mb-0 fw-bold">{{ user.first_name }} {{ user.last_name }}</p>
            <small>Student</small>
          </div>
        </div>

        <!-- Sidebar Links -->
        <a href="{% url 'student_dashboard' %}" class="{% if request.path == '/dashboard/' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'student_post_test' %}" class="{% if request.path == '/post-test/' %}active{% endif %}">Post Test</a>
        <a href="{% url 'logout' %}" class="logout-link mt-auto">Logout</a>
      </nav>

      <!-- Main content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{% static 'js/student_dashboard.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
